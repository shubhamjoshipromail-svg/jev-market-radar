<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar, how it works</title>
<meta name="description" content="A 68-second explainer: how Radar reads breaking news, checks it against live Polymarket markets with Jev, and keeps a public track record.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  /* ---------- page chrome (standalone) ---------- */
  .fp { max-width: 1152px; margin: 0 auto; padding: 28px 16px 64px; }
  .fp-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; margin-bottom: 20px; }
  .fp-head h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.015em; }
  .fp-head h1 span { color: var(--ink-3); font-weight: 400; }
  .fp-head nav { display: flex; gap: 18px; font-size: 13px; }
  .fp-head a { color: var(--ink-2); text-decoration: none; }
  .fp-head a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }

  .frame { position: relative; aspect-ratio: 16 / 9; overflow: hidden; background: var(--surface);
    border: 1px solid var(--line); border-radius: 8px; }
  .stage { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; background: var(--surface); }
  .layer { position: absolute; inset: 0; opacity: 0; }
  .layer canvas { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; }
  .layer svg.ov { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; overflow: visible; }
  .a { position: absolute; }

  /* ---------- controls ---------- */
  .ctl { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; margin-top: 12px; }
  .ctl button.pp { border: 1px solid var(--line-2); background: var(--raise); border-radius: 6px; width: 36px; height: 32px; cursor: pointer; display: grid; place-items: center; color: var(--ink); }
  .ctl button.pp:hover { border-color: var(--ink-3); }
  .ctl .time { font: 12px var(--mono); color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .chap { display: flex; gap: 3px; min-width: 0; }
  .chap button { all: unset; box-sizing: border-box; cursor: pointer; min-width: 0; padding: 8px 0 0; position: relative; }
  .chap button::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--mid); border-radius: 2px; }
  .chap button i { position: absolute; left: 0; top: 0; height: 3px; background: var(--ink); border-radius: 2px; width: 0; }
  .chap button span { display: block; font: 11px var(--mono); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 4px; }
  .chap button.on span { color: var(--ink); }
  .chap button:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

  .now { display: none; margin: 12px 0 0; font-size: 14px; line-height: 1.5; color: var(--ink-2); min-height: 6em; }
  @media (max-width: 700px) { .now { display: block; } }
  details.tx { margin-top: 28px; border-top: 1px solid var(--line); padding-top: 14px; font-size: 14px; color: var(--ink-2); }
  details.tx summary { cursor: pointer; color: var(--ink); font-weight: 500; }
  details.tx ol { margin: 12px 0 0; padding-left: 22px; display: grid; gap: 6px; max-width: 72ch; }

  /* ---------- storyboard (reduced motion) ---------- */
  .board { display: none; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 20px; }
  .board figure { margin: 0; }
  .board figcaption { margin-top: 8px; font-size: 14px; color: var(--ink-2); }
  .board figcaption b { font: 500 11px var(--mono); color: var(--ink-3); letter-spacing: .04em; display: block; margin-bottom: 2px; }
  .rm-note { display: none; font-size: 13px; color: var(--ink-3); margin: 0 0 16px; }
  .rm-note button { font: inherit; color: var(--ink); background: none; border: 0; padding: 0; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  html.static .board, html.static .rm-note { display: grid; }
  html.static .rm-note { display: block; }
  html.static #player { display: none; }
  @media (max-width: 700px) {
    .board { grid-template-columns: 1fr; }
    .chap button span { visibility: hidden; }
    .chap button.on span { visibility: visible; overflow: visible; }
  }

  /* ---------- embed / record: stage only ---------- */
  html.bare body { background: var(--surface); }
  html.bare .fp { max-width: none; padding: 0; margin: 0; }
  html.bare .fp-head, html.bare .ctl, html.bare .now, html.bare details.tx, html.bare .rm-note { display: none; }
  html.bare .frame { border: 0; border-radius: 0; }

  /* ---------- scene typography (stage units: 1280 x 720) ---------- */
  .lab { font: 500 14px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
  .cap { font-size: 38px; line-height: 1.15; font-weight: 600; letter-spacing: -0.022em; color: var(--ink); }
  .k { font: 500 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .ink2 { color: var(--ink-2); } .ink3 { color: var(--ink-3); }
  .rule { position: absolute; height: 1px; background: var(--line); }
  .ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* S1 */
  .src { font: 14px/24px var(--mono); color: var(--ink-3); white-space: nowrap; }
  .src.hot { color: var(--ink); }
  .row1 { position: absolute; left: 520px; width: 688px; height: 46px; display: grid; grid-template-columns: 150px 1fr; gap: 16px; align-items: center; border-top: 1px solid var(--line); }
  .row1 .rs1 { font: 13px var(--mono); color: var(--ink-3); }
  .row1 .rt1 { font-size: 18px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row1.focus { border-top-color: var(--ink); }
  .row1.focus .rt1 { white-space: normal; line-height: 1.25; font-weight: 500; }

  /* S3 list */
  .cand { position: absolute; left: 900px; width: 308px; font-size: 15px; line-height: 24px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cand.me { color: var(--ink); font-weight: 500; }

  /* S4 */
  .qrow .hd { display: flex; align-items: baseline; gap: 12px; }
  .qrow .n { font: 500 14px var(--mono); color: var(--ink-3); width: 16px; }
  .qrow .ti { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
  .qrow .ty { margin-left: auto; font: 12px var(--mono); color: var(--ink-3); letter-spacing: .04em; }
  .qrow .qq { font-size: 15px; color: var(--ink-2); margin: 2px 0 0 28px; }
  .bar { position: absolute; height: 6px; background: var(--mid); border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--ink); border-radius: 3px; width: 0; }
  .val { font: 500 22px var(--mono); font-variant-numeric: tabular-nums; text-align: right; width: 80px; }
  .col { position: absolute; width: 112px; }
  .col .v { position: absolute; left: 0; right: 0; top: 0; font: 13px var(--mono); color: var(--ink-2); text-align: center; font-variant-numeric: tabular-nums; }
  .col .b { position: absolute; left: 36px; width: 40px; bottom: 26px; border-radius: 2px 2px 0 0; }
  .col .l { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; font-size: 13px; color: var(--ink-3); white-space: nowrap; }
  .col.pick .l { color: var(--ink); font-weight: 500; }
  .track { position: absolute; height: 2px; background: var(--line-2); }
  .tick { position: absolute; width: 1px; height: 10px; background: var(--ink-3); }
  .tl { position: absolute; font-size: 13px; color: var(--ink-3); transform: translateX(-50%); white-space: nowrap; }
  .tl.on { color: var(--ink); font-weight: 500; }
  .mark { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: var(--ink); border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--ink); }

  /* S5 */
  .chk { position: absolute; left: 72px; width: 640px; height: 56px; display: grid; grid-template-columns: 210px 110px 1fr 70px; align-items: center; border-top: 1px solid var(--line); }
  .chk .nm { font-size: 18px; }
  .chk .vv { font: 500 20px var(--mono); font-variant-numeric: tabular-nums; }
  .chk .th { font: 15px var(--mono); color: var(--ink-3); }
  .chk .rs { font: 500 14px var(--mono); text-align: right; letter-spacing: .04em; }
  .chk.pass .rs { color: var(--ink-2); }
  .chk.fail .nm, .chk.fail .vv { color: var(--ink-3); }
  .chk.fail .rs { color: var(--no); }

  /* S6 */
  .card { position: absolute; left: 72px; top: 184px; width: 540px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--raise); padding: 22px 24px; }
  .dia { display: inline-block; width: 9px; height: 9px; background: var(--warn); transform: rotate(45deg); margin-right: 10px; }
  .bdg { font: 500 12px var(--mono); letter-spacing: .06em; padding: 2px 7px; border-radius: 3px; background: var(--warn); color: #1a1400; }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; margin-top: 18px; }
  .facts div { font-size: 13px; color: var(--ink-3); }
  .facts b { display: block; font: 500 17px var(--mono); color: var(--ink); margin-top: 2px; }
  .chart text { font: 13px var(--mono); fill: var(--ink-3); }
  .chart .ax { stroke: var(--line-2); }
  .chart .base { stroke: var(--ink-3); stroke-dasharray: 3 4; }
  .chart .ln { stroke: var(--yes); stroke-width: 2.5; fill: none; stroke-linejoin: round; stroke-linecap: round; }
  .chart .pt { fill: var(--yes); }
  .chart .pend { fill: var(--surface); stroke: var(--line-2); stroke-width: 1.5; stroke-dasharray: 2 2; }

  /* S7 */
  .lg { position: absolute; left: 72px; width: 1136px; display: grid; grid-template-columns: 1fr 118px 96px 80px 80px 80px 150px; align-items: center; column-gap: 12px; height: 52px; border-top: 1px solid var(--line); }
  .lg.lh { border-top: 0; height: 30px; }
  .lg.lh div { font: 500 12px var(--mono); letter-spacing: .06em; color: var(--ink-3); text-transform: uppercase; }
  .lg div { font-size: 16px; }
  .lg .m { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lg .c, .lg .p { font: 16px var(--mono); font-variant-numeric: tabular-nums; }
  .lg .p { text-align: right; }
  .lg.lh .p { text-align: right; }
  .up { color: var(--yes); } .dn { color: var(--no); }
  .vd { font: 500 14px var(--mono); text-align: right; }
  .vd.ok { color: var(--ink); } .vd.bad { color: var(--no); } .vd.flat { color: var(--ink-3); }

  /* coda */
  .ev { position: absolute; display: grid; }
  .ev b { font: 500 44px var(--mono); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .ev span { font-size: 15px; color: var(--ink-2); }
</style>
<script>
  // mode flags before first paint: ?record / ?embed -> bare stage; reduced motion -> storyboard
  (function () {
    var q = new URLSearchParams(location.search), d = document.documentElement;
    if (q.has("record") || q.has("embed")) d.classList.add("bare");
    if (q.get("theme")) d.setAttribute("data-theme", q.get("theme"));
    var rm = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (rm && !q.has("record") && !q.has("t") && !q.has("play")) d.classList.add("static");
  })();
</script>
</head>
<body>
<main class="fp">
  <header class="fp-head">
    <h1>Radar <span>how it works, in 68 seconds</span></h1>
    <nav><a href="/">Home</a><a href="/board.html">Live board</a><a href="/scorecard.html">Scorecard</a></nav>
  </header>

  <p class="rm-note">Your system asks for reduced motion, so the film is shown as still frames. <button type="button" id="playAnyway">Play the animation</button></p>
  <div class="board" id="board" role="group" aria-label="Storyboard"></div>

  <div id="player">
    <div class="frame" id="frame" role="img" aria-label="Animated explainer of the Radar pipeline. A transcript follows below."></div>
    <div class="ctl">
      <button class="pp" id="pp" type="button" aria-label="Pause"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path id="ppIcon" d="M2 1h3v10H2zM7 1h3v10H7z" fill="currentColor"/></svg></button>
      <div class="chap" id="chap"></div>
      <span class="time" id="time">0:00</span>
    </div>
    <p class="now" id="now" aria-hidden="true"></p>
  </div>

  <details class="tx">
    <summary>Transcript</summary>
    <ol id="tx"></ol>
  </details>
</main>

<script>
/* Radar explainer. Everything is a pure function of time T, so the film can be scrubbed, shown as stills,
   or captured frame by frame. Data below is real: pulled from data/radar.db and eval/RESULTS.md on 2026-09-29. */
const DATA = {
  markets: 38033,
  headline: "Leon Edwards withdraws from UFC title fight after suffering serious knee injury",
  market: "Will Leon Edwards be the UFC Welterweight Champion on December 31, 2026?",
  rules: "This market will resolve according to the official UFC Welterweight division champion on December 31, 2026 at 12:00 PM ET. Only official UFC division champions will count. Interim champions will not count.",
  judgment: { relevant: 0.92, same_period: 0.37, effect_conf: 0.93, strength: 2.0, latency_ms: 174,
    probs: { resolves_yes: 0.00, raises_yes: 0.00, no_effect: 0.04, lowers_yes: 0.95, resolves_no: 0.01 } },
  leonPrice: 0.0005, leonVolume24h: 0,
  candidates: [
    "Will Khamzat Chimaev fight Sean Strickland next?",
    "Will Dricus Du Plessis fight Nasourdine Imavov next?",
    "Will Leon Edwards be the UFC Welterweight Champion on December 31, 2026?",
    "UFC 332: Roberto Soldic vs. Khaos Williams (Welterweight, Main Card)",
    "Will Ilia Topuria fight Arman Tsarukyan next?",
    "Will the fight end before Round 3?",
    "UFC 332: Court McGee vs. Eric Nolan (Welterweight, Early Prelims)",
    "Will Conor McGregor fight Michael Chandler next?",
    "Fight to Go the Distance?",
    "Will Max Holloway fight Justin Gaethje next?",
    "UFC 332: Jacobe Smith vs. Bruce Whitehead (Welterweight, Early Prelims)",
  ],
  ticker: [
    ["reuters.com", "China's factory activity returns to growth in September amid AI boom"],
    ["espn", "Mathis Albert (17) becomes youngest goal-scorer in U.S. men's history"],
    ["guardian world", "David Shoebridge elected new Greens leader after pledging to ‘replace’ Labor"],
    ["cnbc", "30-year Treasury bond yield scales to highest level since 2002"],
    ["wsj.com", "The Gap Between the Rich and the Very, Very Rich Is Getting Wider"],
    ["espn", "White Sox top Astros in Game 1; first playoff win in 5 years"],
    ["google news", "South Korea says North Korean mines behind DMZ blast violated armistice - Reuters"],
    ["pasted", "Leon Edwards withdraws from UFC title fight after suffering serious knee injury"],
  ],
  // alert #31 in the live log. checks = YES price at +1, +5, +10, +60 min (null = not yet checked)
  alert: { kind: "MOVER", source: "google news · Battery Power", dir: -1, effect: "YES less likely", strength: "settled fact",
    headline: "Braves initiate exorcism with Austin Riley’s huge homer, 5-3 win over Phillies in NLWC Game 1",
    market: "Will Philadelphia Phillies advance to the NLDS in the 2026 MLB Playoffs?", relevant: 0.92,
    at: 0.285, checks: [0.285, 0.265, 0.27, null] },
  // a slice of the live alert log: [market, direction, at alert, +1, +5, +10]
  ledger: [
    ["Will Philadelphia Phillies advance to the NLDS in the 2026 MLB Playoffs?", -1, 0.285, 0.285, 0.265, 0.27],
    ["US-Canada diplomatic agreement to lower tariffs by December 31?", -1, 0.555, 0.55, 0.61, 0.555],
    ["Will Trump issue an AI Safety Executive Order by October 31?", -1, 0.0525, 0.054, 0.054, 0.053],
    ["Will the 30-year Treasury yield hit 5.70% before 2027?", 1, 0.785, 0.785, 0.785, 0.785],
    ["Will Chicago White Sox advance to the ALDS in the 2026 MLB Playoffs?", 1, 0.685, 0.695, 0.695, 0.685],
  ],
  eval: { precision: "1.00", recall: "0.93", direction: "39/40", pairs: 100 },
};

const RSS = ["bbc world", "bbc business", "guardian world", "al jazeera", "cnbc", "npr", "google news", "politico",
  "espn", "coindesk", "fox news", "nyt", "wsj world"];
const BSKY = ["apnews.com", "reuters.com", "nytimes.com", "bbcnews", "washingtonpost.com", "cnn.com", "politico.com",
  "axios.com", "bloomberg.com", "theguardian.com", "npr.org", "wsj.com", "nbcnews.com", "aljazeera.com", "espn.com", "coindesk.com"];

/* ---------- helpers ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const E = { out: (t) => 1 - Math.pow(1 - t, 3), inOut: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2), lin: (t) => t };
const P = (t, a, b, e = E.inOut) => e(clamp((t - a) / (b - a)));
const lerp = (a, b, k) => a + (b - a) * k;
const fmt = (n) => Math.round(n).toLocaleString("en-US");
const cents = (p) => (p * 100 < 10 ? (p * 100).toFixed(2) : (p * 100).toFixed(1)) + "¢";
function h(tag, cls, parent, html, style) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  if (style) Object.assign(e.style, style);
  parent && parent.appendChild(e);
  return e;
}
const at = (el, x, y, w) => { el.style.left = x + "px"; el.style.top = y + "px"; if (w) el.style.width = w + "px"; return el; };
const show = (el, k, dy = 0) => { el.style.opacity = k; el.style.transform = dy ? `translateY(${(1 - k) * dy}px)` : ""; };
const SVGNS = "http://www.w3.org/2000/svg";
function sv(tag, attrs, parent) { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent && parent.appendChild(e); return e; }
function hash(i) { let x = Math.imul(i ^ 0x9e3779b9, 0x85ebca6b); x ^= x >>> 13; x = Math.imul(x, 0xc2b2ae35); x ^= x >>> 16; return (x >>> 0) / 4294967296; }
function colors() {
  const cs = getComputedStyle(document.documentElement), g = (v) => cs.getPropertyValue(v).trim();
  return { ink: g("--ink"), ink2: g("--ink-2"), ink3: g("--ink-3"), line: g("--line"), line2: g("--line-2"), mid: g("--mid"), yes: g("--yes"), no: g("--no"), surface: g("--surface") };
}
function header(L, n, label, caption) {
  at(h("div", "a lab", L, `${String(n).padStart(2, "0")} &nbsp;${label}`), 72, 52);
  at(h("div", "a cap", L, caption), 72, 80, 1136);
}

/* ---------- the dot field shared by scenes 2 and 3 ---------- */
const F = { x: 72, y: 196, w: 760, h: 440, cols: 260 };
F.rows = Math.ceil(DATA.markets / F.cols); F.sx = F.w / F.cols; F.sy = F.h / F.rows;
const DX = new Float32Array(DATA.markets), DY = new Float32Array(DATA.markets), KEY = new Float32Array(DATA.markets);
for (let i = 0; i < DATA.markets; i++) {
  const c = i % F.cols, r = Math.floor(i / F.cols);
  DX[i] = F.x + c * F.sx; DY[i] = F.y + r * F.sy;
  KEY[i] = 0.72 * (c / F.cols) + 0.28 * hash(i);
}
const CAND = [];
for (let j = 0; CAND.length < 40; j++) { const i = Math.floor(hash(j + 7777) * DATA.markets); if (!CAND.includes(i)) CAND.push(i); }
const LEON_SLOT = 2, LEON = CAND[LEON_SLOT];
const candTarget = (c) => (c < 11 ? [884, 300 + c * 24 + 10] : [884 + (c - 11) * 11, 588]);

/* ---------- scenes: build(layer, stage) returns update(t) ---------- */
const SCENES = [
  { key: "news", label: "News", dur: 8, still: 6.6,
    text: "Radar reads breaking news the moment it lands: 13 RSS feeds and 16 Bluesky news accounts, or a headline you paste in.",
    build(L) {
      header(L, 1, "News", "Radar reads breaking news the moment it lands.");
      at(h("div", "a k", L, "RSS feeds · 13"), 72, 184);
      at(h("div", "a k", L, "Bluesky accounts · 16"), 262, 184);
      const srcEls = {};
      RSS.forEach((s, i) => { srcEls["r:" + s] = at(h("div", "a src", L, s), 72, 212 + i * 24); });
      BSKY.forEach((s, i) => { srcEls["b:" + s] = at(h("div", "a src", L, s), 262, 212 + i * 24); });
      const srcKey = (s) => (srcEls["b:" + s] ? "b:" + s : srcEls["r:" + s] ? "r:" + s : null);
      at(h("div", "a k", L, "Incoming headlines"), 520, 184);
      const arrive = [0.5, 1.15, 1.8, 2.45, 3.05, 3.65, 4.25, 5.1];
      const rows = DATA.ticker.map(([s, t], j) => {
        const r = h("div", "row1" + (j === 7 ? " focus" : ""), L, `<span class="rs1">${s}</span><span class="rt1">${t}</span>`);
        return r;
      });
      return (t) => {
        rows.forEach((r, j) => {
          const k = P(t, arrive[j], arrive[j] + 0.5, E.out);
          let slot = 0; for (let m = j + 1; m < rows.length; m++) slot += P(t, arrive[m], arrive[m] + 0.5, E.inOut) * (m === 7 ? 1.6 : 1);
          r.style.top = 212 + slot * 46 - (1 - k) * 18 + "px";
          const dim = j === 7 ? 1 : 1 - 0.6 * P(t, 5.7, 6.4);
          r.style.opacity = k * dim * (slot > 8.6 ? 0 : 1);
          if (j === 7) r.style.height = 74 + "px";
        });
        for (const k in srcEls) srcEls[k].classList.remove("hot");
        DATA.ticker.forEach(([s], j) => { const key = srcKey(s); if (key && t >= arrive[j] && t < arrive[j] + 0.9) srcEls[key].classList.add("hot"); });
      };
    } },

  { key: "markets", label: "Markets", dur: 7, still: 5.8,
    text: "Each headline is checked against about 38,000 live Polymarket markets (liquidity at least $1k, not yet ended), each with written resolution rules.",
    build(L, S) {
      header(L, 2, "Markets", "Every headline is checked against 38,000 live markets.");

let acc = 0; SCENES.forEach((s) => { s.t0 = acc; acc += s.dur; });
const TOTAL = acc, FADE = 0.45;

/* ---------- stage ---------- */
function makeStage(host, only) {
  const root = h("div", "stage", host), canvases = [];
  const S = { canvas(L) { const c = h("canvas", "", L); const o = { el: c, ctx: c.getContext("2d") }; canvases.push(o); return o; } };
  const layers = SCENES.map((sc, i) => { if (only != null && only !== i) return null; const L = h("div", "layer", root); return { L, sc, up: sc.build(L, S) }; });
  let k = 1, lastT = 0;
  const api = {
    root,
    fit() {
      const w = host.clientWidth; if (!w) return;
      k = w / 1280; root.style.transform = `scale(${k})`;
      const dpr = Math.min(window.devicePixelRatio || 1, 2), q = k * dpr;
      canvases.forEach((c) => { c.el.width = Math.round(1280 * q); c.el.height = Math.round(720 * q); c.ctx.setTransform(q, 0, 0, q, 0, 0); });
      api.render(lastT);
    },
    render(T) {
      lastT = T; const C = colors();
      layers.forEach((ly, i) => {
        if (!ly) return;
        const s = ly.sc, t = T - s.t0;
        let o;
        if (only != null) o = 1;
        else {
          const fin = i === 0 ? 1 : clamp((t + FADE) / FADE), fout = i === SCENES.length - 1 ? 1 : clamp((s.dur - t) / FADE);
          o = Math.min(fin, fout); if (t < -FADE || t > s.dur) o = 0;
        }
        ly.L.style.opacity = o; ly.L.style.visibility = o > 0 ? "visible" : "hidden";
        if (o > 0) ly.up(clamp(t, 0, s.dur), C);
      });
    },
  };
  new ResizeObserver(() => api.fit()).observe(host);
  return api;
}

/* ---------- player ---------- */
const q = new URLSearchParams(location.search), docEl = document.documentElement;
const frame = document.getElementById("frame");
if (docEl.classList.contains("bare")) { frame.style.aspectRatio = "auto"; frame.style.height = "100vh"; }
const stage = makeStage(frame);
let T = 0, playing = !q.has("t") && !q.has("record"), lastNow = null;
const loop = q.has("embed") || q.has("loop");

const chap = document.getElementById("chap"), timeEl = document.getElementById("time"), nowEl = document.getElementById("now");
const chapBtns = SCENES.map((s, i) => {
  const b = h("button", "", chap, `<i></i><span>${s.key === "end" ? "" : String(i + 1).padStart(2, "0") + " "}${s.label}</span>`);
  b.type = "button"; b.style.flex = s.dur; b.setAttribute("aria-label", `Jump to ${s.label}`);
  b.onclick = () => { T = s.t0 + 0.01; if (!playing) setPlaying(true); draw(); };
  return b;
});
document.getElementById("tx").innerHTML = SCENES.map((s) => `<li>${s.text}</li>`).join("");
const mm = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
function draw() {
  stage.render(T);
  chapBtns.forEach((b, i) => { const s = SCENES[i], f = clamp((T - s.t0) / s.dur); b.firstChild.style.width = f * 100 + "%"; b.classList.toggle("on", T >= s.t0 && T < s.t0 + s.dur); });
  timeEl.textContent = `${mm(T)} / ${mm(TOTAL)}`;
  const cur = SCENES.find((s) => T >= s.t0 && T < s.t0 + s.dur) || SCENES[SCENES.length - 1];
  if (nowEl.dataset.k !== cur.key) { nowEl.dataset.k = cur.key; nowEl.textContent = cur.text; }
}
function setPlaying(v) {
  playing = v; lastNow = null;
  document.getElementById("ppIcon").setAttribute("d", v ? "M2 1h3v10H2zM7 1h3v10H7z" : "M2 1l9 5-9 5z");
  document.getElementById("pp").setAttribute("aria-label", v ? "Pause" : "Play");
  if (v) requestAnimationFrame(tick);
}
function tick(now) {
  if (!playing) return;
  if (lastNow != null) T += (now - lastNow) / 1000;
  lastNow = now;
  if (T >= TOTAL) { if (loop) T = 0; else { T = TOTAL - 0.001; draw(); setPlaying(false); return; } }
  draw(); requestAnimationFrame(tick);
}
document.getElementById("pp").onclick = () => { if (!playing && T >= TOTAL - 0.01) T = 0; setPlaying(!playing); draw(); };
document.addEventListener("keydown", (e) => {
  if (e.target.closest && e.target.closest("button,summary,a") && e.key === " ") return;
  if (e.key === " ") { e.preventDefault(); document.getElementById("pp").click(); }
  if (e.key === "ArrowRight") { T = Math.min(TOTAL - 0.01, T + 5); draw(); }
  if (e.key === "ArrowLeft") { T = Math.max(0, T - 5); draw(); }
});

/* capture hooks: ?t=12.5 freezes a frame; window.film.render(T) for frame-by-frame recording */
window.film = { duration: TOTAL, render: (t) => { T = t; draw(); }, scenes: SCENES.map((s) => ({ key: s.key, t0: s.t0, dur: s.dur, still: s.t0 + s.still })) };
if (q.has("t")) T = parseFloat(q.get("t")) || 0;

/* ---------- storyboard for reduced motion ---------- */
function buildBoard() {
  const board = document.getElementById("board");
  if (board.childElementCount) return;
  SCENES.forEach((s, i) => {
    const f = h("figure", "", board);
    const fr = h("div", "frame", f); fr.setAttribute("aria-hidden", "true");
    const st = makeStage(fr, i); st.render(s.t0 + s.still);
    h("figcaption", "", f, `<b>${s.key === "end" ? "" : String(i + 1).padStart(2, "0") + " "}${s.label.toUpperCase()}</b>${s.text}`);
  });
}
document.getElementById("playAnyway").onclick = () => { docEl.classList.remove("static"); stage.fit(); setPlaying(true); };

document.fonts.ready.then(() => {
  if (docEl.classList.contains("static")) { buildBoard(); playing = false; }
  stage.fit(); draw();
  if (playing) setPlaying(true);
  window.filmReady = true;
});
</script>
</body>
</html>
